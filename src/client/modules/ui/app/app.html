<template>
    <ui-spinner lwc:if={isLoading}></ui-spinner>
    <template lwc:else>
        <h1>Gcal Cleaner</h1>

        <template lwc:if={user}>
            <img src={user.picture} alt="User avatar" />
            <p>
                Hi {user.given_name} ({user.email})
                <a href="/auth/logout" class="inline-link">Log Out</a>
            </p>
            <form onsubmit={handleSearch}>
                <input
                    type="search"
                    value={searchTerm}
                    onchange={handleSearchTermChange}
                    placeholder="Filter events"
                />
                <button>Search</button>
            </form>
            <div class="two-cols">
                <div>
                    <h2>Events</h2>
                    <ui-event-list
                        events={events}
                        ondelete={handleDeleteEvents}
                    ></ui-event-list>
                </div>
                <div>
                    <h2>Spam</h2>
                    <ui-event-list
                        events={spamEvents}
                        ondelete={handleDeleteEvents}
                    ></ui-event-list>
                </div>
            </div>
        </template>
        <template lwc:else>
            <p>
                <a href="/auth/login">Log In</a>
            </p>
        </template>
    </template>
</template>
